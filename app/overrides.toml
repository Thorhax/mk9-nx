# Mortal Kombat Komplete Edition-specific analysis corrections for the code generator.
#
# Every entry needs its evidence (which tool or which log found it). The tools that produce candidates:
#   tools/find_gaps.py, tools/gap_fixpoint.py   code the automatic discovery left without a function
#   tools/pointer_scan.py, pointer_fixpoint.py  code pointers stored in data (vtables, callback tables)
#   tools/switch_check.py                       truncated jump tables
#   tools/runtime_gap_resolver.py               "Call to invalid or unregistered function" from a game log

# The CRT's setjmp/longjmp (root keys: they must stay outside any table); recompiled as plain calls, longjmp would
# return into a foreign stack frame. Found by shape in the decrypted image (tools/xex_image.py, 2026-10-20), the same
# CRT code as usf4-nx's; setjmp has no .pdata entry. setjmp is called from 28 sites (7 generated files).
#   setjmp  0x82FE1340: optional override pointer at 0x834CF6A0 (bnectr), then mflr/mfcr, stfd f14-f31 at 0..136(r3),
#           std r13-r31 at 152..296(r3), stvx128 of the vector registers from 320(r3).
#   longjmp 0x82FE1020: mr r7,r3; the mirror image through r7 (lfd f14-f31, ld r13-r31, lvx128), mtlr from 308(r7),
#           ld r1 from 144(r7), mtcrf from 304(r7), mr r3,r6 (the value); blr. When 312(r3) != 0 it takes the
#           unwinding path instead (0x82FE130C).
setjmp_address = 0x82FE1340
longjmp_address = 0x82FE1020

[functions]
# First codegen run (rexglue codegen, 2026-10-20): a direct unconditional branch (`b`, a tail call) to each address
# below, which automatic discovery had not assigned to any function ("target not in any function"; the caller is
# listed). None has a .pdata entry; each follows an unconditional terminator (b, bctr or blr) and begins with code
# that reads only argument registers. No sizes imposed unless noted: the Discover phase determines each boundary.
"0x82F6A238" = { }  # from 0x82F6BA64 (addi r3,r3,40 / b: adjustor thunk); after a b; lwz r11,12(r3) / li r6,0 / addic.
"0x82AC5140" = { }  # from 0x82AC6094 (addi r3,r3,-44 / b: adjustor thunk); after a b; lwz r3,76(r3) / blr (getter)
"0x82780F40" = { }  # from 0x827902CC (addi r3,r3,-44 / b: adjustor thunk); after a bctr; lwz r3,128(r3) / blr (getter)
"0x8240AA80" = { }  # from 0x8246FA98 (lwz r3,4(r10) / b); after a bctr; lis r11,0x833C / lfs f0,0(r3) / stfs to a global
"0x82AE9130" = { }  # from 0x82AE931C (lwz r4,76(r3) / b); after a b; li r11,0 / cmpwi cr6,r4,0 / stores to r3's object
"0x830179C0" = { }  # from 0x8301B8F4 (addi r3,r3,240 / b: adjustor thunk); after a bctr; lwz r8,0(r3) / lwz r10,4(r3)
# Shared "return 0" blocks (li r3,0 / blr) that the cases of FMOD-style property getters/setters branch back to after
# storing a float (lfs/stfs ... / b back); each follows a blr. As a function of its own the block keeps its meaning (it
# returns 0 in r3); size 8 so it takes none of the case fragments after it.
"0x82E6F3E4" = { size = 0x8 }  # from 0x82E6F3F4 (lfs f0,28(r11) / stfs f0,0(r5) / b)
"0x82E540F4" = { size = 0x8 }  # from 0x82E54104 (lfs f0,28(r11) / stfs f0,0(r5) / b)
"0x82E6F4FC" = { size = 0x8 }  # from 0x82E6F50C (lfs f0,0(r5) / stfs f0,28(r11) / b)

